name: Integration tests for expiring user

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integration:
    name: Integration tests - PHP ${{ matrix.php }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php: ['8.4', '8.5']
    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Pull images
        run: composer integration-pull

      - name: Setup integration environment
        run: |
          rm tests/build/services/users.env
          echo "JWT_TOKEN_TTL=10" >> tests/build/services/users.env
          composer integration-setup
        env:
          DATABASE_URL: postgresql://postgres:password!@0.0.0.0:5432/app-web?serverVersion=12&charset=utf8

      - name: Verify integration environment state
        run: |
          composer integration-status
          sleep 10

      - name: Run tests
        run: composer test-integration-expiring-user
        env:
          DATABASE_URL: postgresql://postgres:password!@0.0.0.0:5432/app-web?serverVersion=12&charset=utf8

      - name: Dump docker-compose logs
        if: always()
        run: composer integration-logs
